version = 1

# Non-code project content and formats that cannot carry source headers. A skill's
# skill.oms.sig is generated by NVSkills CI and must stay byte-identical to verify.
# First-party source files carry their own SPDX headers; new source files
# without headers therefore fail REUSE lint.
[[annotations]]
path = ["docs/html/**", "**/*.md", "**/*.json", "**/*.txt", "**/*.xml", "**/*.svg", "**/*.png", "**/*.webp", "docs/site/snippets/*.out", "**/*.html", "**/*.css", "**/*.lock", "**/*.usda", "**/*.map", "**/*.cmd", "*.Dockerfile", "**/*.Dockerfile", ".clang-format", ".gitattributes", ".gitignore", ".git-blame-ignore-revs", "python/tests/__init__.py", ".github/CODEOWNERS", "NOTICE", "skills/*/skill.oms.sig"]
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# Preserve vendored headers and Packman files as received.
[[annotations]]
path = "include/dlpack/dlpack.h"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (c) 2017 - by Contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tools/packman/**"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (c) 2019-2024 NVIDIA CORPORATION"
SPDX-License-Identifier = "Apache-2.0"


